[project]
name = "whisper-backend"
version = "1.0.0"
description = "FastAPI speech-to-text service backed by faster-whisper (CPU / int8)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",
    "faster-whisper==1.1.0",
    # faster-whisper 1.1.0 imports `requests` directly and expects the 0.x Hub client;
    # huggingface-hub 1.x+ no longer pulls requests in transitively.
    "huggingface-hub>=0.23,<1.0",
    "requests==2.32.3",
    "numpy>=1.26",
    "wsproto>=1.2",
]

[tool.uv]
package = false
