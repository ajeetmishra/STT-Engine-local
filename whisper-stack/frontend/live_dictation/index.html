<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live dictation</title>
<style>
  :root {
    --primary: #ff4b4b;
    --text: #31333f;
    --bg: #ffffff;
    --muted: rgba(49, 51, 63, 0.55);
    --border: rgba(49, 51, 63, 0.2);
    --recording: #e5484d;
    --font: "Source Sans Pro", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--text); font-family: var(--font); }
  .wrap { display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 8px; }
  .controls { display: flex; align-items: center; gap: 14px; }
  button.mic {
    width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); cursor: pointer; flex: none;
    display: grid; place-items: center; transition: background .15s, color .15s, box-shadow .15s;
  }
  button.mic:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  button.mic:disabled { opacity: .5; cursor: progress; }
  button.mic svg { width: 26px; height: 26px; }
  button.mic.recording {
    background: var(--recording); border-color: var(--recording); color: #fff;
    animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(229, 72, 77, .55); }
    100% { box-shadow: 0 0 0 14px rgba(229, 72, 77, 0); }
  }
  .status { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .status-text { font-size: 14px; }
  .status-text.error { color: var(--recording); }
  .meter { height: 4px; width: 100%; max-width: 220px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--primary); transition: width 80ms linear; }
  .live {
    min-height: 96px; max-height: 260px; overflow-y: auto; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; line-height: 1.5; font-size: 16px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .live .partial { color: var(--muted); font-style: italic; }
  .live .placeholder { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <button class="mic" id="mic" title="Start live dictation" aria-label="Start live dictation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 10a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="17" x2="12" y2="22"></line>
      </svg>
    </button>
    <div class="status">
      <div class="status-text" id="status">Click the mic and start speaking.</div>
      <div class="meter" aria-hidden="true"><div id="level"></div></div>
    </div>
  </div>
  <div class="live" id="live" aria-live="polite"><span class="placeholder">Words appear here as you speak. Grey text is tentative and may still change.</span></div>
</div>

<script>
(() => {
  "use strict";

  const TARGET_RATE = 16000;
  const CHUNK_SAMPLES = 1600; // 100 ms of 16 kHz audio per WebSocket frame

  // AudioWorklet: downsample the mic (usually 44.1/48 kHz) to 16 kHz mono int16.
  // A box-filter average per output sample gives cheap anti-aliasing.
  const WORKLET_SOURCE = `
    class Pcm16Downsampler extends AudioWorkletProcessor {
      constructor() {
        super();
        this.ratio = sampleRate / ${TARGET_RATE};
        this.phase = 0; this.sum = 0; this.count = 0;
        this.out = new Int16Array(${CHUNK_SAMPLES}); this.n = 0; this.peak = 0;
      }
      process(inputs) {
        const input = inputs[0] && inputs[0][0];
        if (!input) return true;
        for (let i = 0; i < input.length; i++) {
          this.sum += input[i]; this.count++; this.phase++;
          if (this.phase >= this.ratio) {
            this.phase -= this.ratio;
            const s = Math.max(-1, Math.min(1, this.sum / this.count));
            this.sum = 0; this.count = 0;
            this.peak = Math.max(this.peak, Math.abs(s));
            this.out[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
            if (this.n === this.out.length) {
              const chunk = this.out; this.out = new Int16Array(${CHUNK_SAMPLES}); this.n = 0;
              this.port.postMessage({ pcm: chunk.buffer, peak: this.peak }, [chunk.buffer]);
              this.peak = 0;
            }
          }
        }
        return true;
      }
    }
    registerProcessor("pcm16-downsampler", Pcm16Downsampler);
  `;

  // ---- Streamlit component protocol (what streamlit-component-lib does, without a build step)
  const toStreamlit = (type, data) =>
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  const setFrameHeight = () =>
    toStreamlit("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
  const setComponentValue = (value) =>
    toStreamlit("streamlit:setComponentValue", { value, dataType: "json" });

  let args = {};
  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "streamlit:render") return;
    args = event.data.args || {};
    applyTheme(event.data.theme);
    setFrameHeight();
  });

  function applyTheme(theme) {
    if (!theme) return;
    const root = document.documentElement.style;
    if (theme.primaryColor) root.setProperty("--primary", theme.primaryColor);
    if (theme.textColor) {
      root.setProperty("--text", theme.textColor);
      root.setProperty("--muted", `color-mix(in srgb, ${theme.textColor} 55%, transparent)`);
      root.setProperty("--border", `color-mix(in srgb, ${theme.textColor} 20%, transparent)`);
    }
    if (theme.backgroundColor) root.setProperty("--bg", theme.backgroundColor);
    if (theme.font) root.setProperty("--font", theme.font);
  }

  // ---- UI
  const micBtn = document.getElementById("mic");
  const statusEl = document.getElementById("status");
  const levelEl = document.getElementById("level");
  const liveEl = document.getElementById("live");

  function setStatus(text, isError = false) {
    statusEl.textContent = text;
    statusEl.classList.toggle("error", isError);
  }

  function render() {
    liveEl.replaceChildren();
    if (!committed && !partial) {
      const span = document.createElement("span");
      span.className = "placeholder";
      span.textContent = state === "idle" ? "Words appear here as you speak." : "Listening…";
      liveEl.append(span);
    } else {
      liveEl.append(document.createTextNode(committed.trimStart()));
      if (partial) {
        const span = document.createElement("span");
        span.className = "partial";
        span.textContent = committed ? partial : partial.trimStart();
        liveEl.append(span);
      }
    }
    liveEl.scrollTop = liveEl.scrollHeight;
    setFrameHeight();
  }

  function setState(next) {
    state = next;
    micBtn.classList.toggle("recording", state === "recording");
    micBtn.disabled = state === "connecting" || state === "finalizing";
    const label = state === "recording" ? "Stop live dictation" : "Start live dictation";
    micBtn.title = label;
    micBtn.setAttribute("aria-label", label);
    if (state !== "recording") levelEl.style.width = "0";
  }

  // ---- Session
  let state = "idle"; // idle | connecting | recording | finalizing
  let ws = null, audioCtx = null, stream = null;
  let sessionId = null, committed = "", partial = "", delivered = false;

  function wsUrl() {
    if (args.ws_url) return args.ws_url;
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    return `${scheme}://${location.hostname}:${args.backend_port || 8000}/ws/transcribe`;
  }

  // Server text pieces carry Whisper's own leading spaces (" off", "-site"), so they are
  // concatenated as-is rather than joined with spaces.
  function appendCommitted(text) {
    if (text) committed += text;
  }

  // Hand the session's text to Python exactly once (it is appended to the transcript there).
  function deliver() {
    if (delivered || !sessionId) return;
    delivered = true;
    setComponentValue({ id: sessionId, text: committed.trim() });
  }

  function releaseAudio() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    if (audioCtx) audioCtx.close().catch(() => {});
    stream = null; audioCtx = null;
  }

  async function start() {
    sessionId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random();
    committed = ""; partial = ""; delivered = false;
    setState("connecting");
    render();
    setStatus("Requesting microphone…");

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch (err) {
      setState("idle");
      setStatus(`Microphone unavailable: ${err.message || err.name}. Allow mic access for this page.`, true);
      return;
    }

    setStatus("Connecting to backend…");
    const url = wsUrl();
    ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";

    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      if (msg.type === "ready") {
        startAudio().catch((err) => fail(`Audio capture failed: ${err.message || err}`));
      } else if (msg.type === "update") {
        appendCommitted(msg.committed);
        partial = msg.partial || "";
        render();
      } else if (msg.type === "final") {
        committed = typeof msg.text === "string" ? msg.text : committed + (msg.committed || "");
        partial = "";
        render();
        deliver();
        setState("idle");
        setStatus(committed ? "Added to transcript below. Click the mic to dictate more."
                            : "No speech detected. Click the mic to try again.");
      } else if (msg.type === "error") {
        fail(msg.message);
      }
    };

    ws.onerror = () => {}; // details arrive via onclose

    ws.onclose = (event) => {
      ws = null;
      releaseAudio();
      if (state === "connecting") {
        fail(`Cannot connect to the live backend at ${url}. Check that the backend container is running, ` +
             `port 8000 is published, and this page's origin is in LIVE_ALLOWED_ORIGINS.`);
      } else if (state === "recording" || state === "finalizing") {
        fail(`Connection to backend lost (code ${event.code}).`);
      }
    };
  }

  async function startAudio() {
    audioCtx = new AudioContext();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    const moduleUrl = URL.createObjectURL(new Blob([WORKLET_SOURCE], { type: "application/javascript" }));
    await audioCtx.audioWorklet.addModule(moduleUrl);
    URL.revokeObjectURL(moduleUrl);

    const source = audioCtx.createMediaStreamSource(stream);
    const node = new AudioWorkletNode(audioCtx, "pcm16-downsampler");
    const sink = audioCtx.createGain();
    sink.gain.value = 0; // keep the graph pulled without playing the mic back
    source.connect(node).connect(sink).connect(audioCtx.destination);

    node.port.onmessage = ({ data }) => {
      if (ws && ws.readyState === WebSocket.OPEN && state === "recording") ws.send(data.pcm);
      levelEl.style.width = `${Math.min(100, Math.round(Math.sqrt(data.peak) * 100))}%`;
    };

    setState("recording");
    render();
    setStatus("Listening… click the mic to stop.");
  }

  function stop() {
    setState("finalizing");
    releaseAudio();
    setStatus("Finalizing…");
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "stop" }));
  }

  function fail(message) {
    const hadSession = state !== "idle";
    setState("idle");
    releaseAudio();
    if (ws) { try { ws.close(); } catch {} ws = null; }
    partial = "";
    render();
    if (hadSession) deliver(); // keep whatever was already committed
    setStatus(message, true);
  }

  micBtn.addEventListener("click", () => {
    if (state === "idle") start();
    else if (state === "recording") stop();
  });

  window.addEventListener("beforeunload", releaseAudio);
  new ResizeObserver(setFrameHeight).observe(document.body);

  render();
  toStreamlit("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
